apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecom-server
spec:
  replicas: 4
  selector:
    matchLabels:
      app: ecom-server
  strategy:
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: ecom-server
    spec:
      containers:
        - name: server
          image: rajivkumawat3/ecom_backend:latest
          ports:
            - containerPort: 5988
          volumeMounts:
            - name: app-volume
              mountPath: /app
          env:
            - name: DB_URL
              value: mongodb://mongo-service:27017
      volumes:
        - name: app-volume
          hostPath:
            path: /app
---
apiVersion: v1
kind: Service
metadata:
  name: server-service
spec:
  selector:
    app: ecom-server
  ports:
    - port: 5988
      targetPort: 5988
  type: NodePort
